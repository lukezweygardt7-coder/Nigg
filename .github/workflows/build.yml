name: Build Rose Companion

'on':
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Rose Forge 1.12.2
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 \
            https://services.gradle.org/distributions/gradle-7.6.4-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-7.6.4/bin" >> "$GITHUB_PATH"

      - name: Locate and extract Rose
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . -type f -name build.gradle \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit || true)"

          if [[ -z "$BUILD_FILE" ]]; then

            ZIP_FILE="$(find . -maxdepth 3 -type f \
              -name 'RoseCompanion-Forge1122-GitHubReady-Updated.zip' \
              -print -quit || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Rose source ZIP not found."
              exit 1
            fi

            mkdir -p .rose-source

            unzip -q "$ZIP_FILE" -d .rose-source

            BUILD_FILE="$(find .rose-source \
              -type f -name build.gradle -print -quit || true)"
          fi

          if [[ -z "$BUILD_FILE" ]]; then
            echo "::error::Could not locate build.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "Detected Rose project: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          required_files=(
            build.gradle
            settings.gradle
            src/main/resources/mcmod.info
            src/main/resources/assets/rosecompanion/textures/entity/rose.png
            src/main/resources/assets/rosecompanion/textures/items/rose_whistle.png
            src/main/java/com/rosecompanion/RoseCompanion.java
            src/main/java/com/rosecompanion/entity/EntityRoseDog.java
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing file: $file"
              exit 1
            fi
            echo "Verified: $file"
          done

          grep -q "ForgeGradle.*5.1.77" build.gradle
          grep -q "1.12.2-14.23.5.2864" build.gradle

          echo "Rose project verification successful."

      - name: Compile and build Rose
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean build \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee build.log

      - name: Verify finished JAR
        id: jar
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name 'RoseCompanion-*.jar' \
            ! -name '*-sources.jar' \
            -print -quit)"

          if [[ -z "$JAR_FILE" ]]; then
            echo "::error::Rose JAR was not generated."
            exit 1
          fi

          test -s "$JAR_FILE"

          jar tf "$JAR_FILE" > jar-contents.txt

          required_entries=(
            mcmod.info
            com/rosecompanion/RoseCompanion.class
            com/rosecompanion/entity/EntityRoseDog.class
            assets/rosecompanion/textures/entity/rose.png
            assets/rosecompanion/textures/items/rose_whistle.png
          )

          for entry in "${required_entries[@]}"; do
            grep -Fxq "$entry" jar-contents.txt || {
              echo "::error::Missing JAR entry: $entry"
              exit 1
            }
          done

          echo "jar_file=$JAR_FILE" >> "$GITHUB_OUTPUT"

          echo "Rose JAR verification successful!"

      - name: Upload compiled Rose mod
        uses: actions/upload-artifact@v4
        with:
          name: RoseCompanion-Forge-1.12.2
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.jar.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if compilation fails
        if: ${{ failure() && steps.project.outputs.project_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Rose-Build-Error-Log
          path: ${{ steps.project.outputs.project_dir }}/build.log
          if-no-files-found: ignore
          retention-days: 7
